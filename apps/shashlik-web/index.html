<!doctype html>
<html lang="ru" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <link rel="apple-touch-icon" href="/logo/pwa-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Шашлыковский" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EF7F1A" />
    <meta
      name="description"
      content="Шашлыковский — шаурма, шашлык, комбо и напитки. Доставка и самовывоз."
    />
    <title>Шашлыковский — шаурма и шашлык</title>
    <script>
      // Тема и графика до первой отрисовки (anti-FOUC).
      try {
        const stored = localStorage.getItem("shashlik:theme");
        const theme =
          stored ??
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.classList.toggle("light", theme !== "dark");
      } catch {}
      try {
        const g = localStorage.getItem("shashlik:graphics:v1");
        document.documentElement.setAttribute(
          "data-graphics",
          g === "normal" || g === "ultra" ? g : "ultra",
        );
      } catch {
        document.documentElement.setAttribute("data-graphics", "ultra");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
