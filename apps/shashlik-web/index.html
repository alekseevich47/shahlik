<!doctype html>
<html lang="ru" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EF7F1A" />
    <meta
      name="description"
      content="Шашлыковский — шаурма, шашлык, комбо и напитки. Доставка и самовывоз."
    />
    <title>Шашлыковский — шаурма и шашлык</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки светлой темы.
      try {
        const stored = localStorage.getItem("shashlik:theme");
        const theme =
          stored ??
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.classList.toggle("light", theme !== "dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
